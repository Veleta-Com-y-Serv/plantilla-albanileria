nombre: Obras Julián Robles
eslogan: Albañil en Talavera de la Reina y su comarca. Pequeñas obras bien hechas.
sector: albanil
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = inicial + nombre en texto.
