  primario: "#585d62"
  acento: "#f26a1b"
  fondo: "#ffffff"
  texto: "#1f2123"
contacto:
  telefono: "925 81 47 26"
  email: hola@obrasjulianrobles.es
  direccion: "Calle Carnicerías 14, 45600 Talavera de la Reina (Toledo)"
  horario: Lunes a viernes de 8:00 a 19:00. Sábados por la mañana para visitas.
  whatsapp: "+34 655 21 87 43"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
  - { texto: Qué hago, url: "/#servicios" }
