  zonas:
    activa: true
    antetitulo: Dónde trabajo
    titulo: Talavera y 40 km alrededor
    texto: "Tierras de Talavera, La Jara y la Campana de Oropesa. Si tu pueblo no está, pregúntame."
    titulo_pagina: "Albañilería en {zona}"
    texto_pagina: "Obras pequeñas y medianas en {zona}, con precio cerrado y por escrito, de la mano de {negocio}."
    imagen: /fotos/zonas.jpg
    items:
      - titulo: Talavera de la Reina
        texto: "Es donde vivo y donde más obras hago: pisos, casas y locales de la ciudad y de sus barrios. Cambio tabiques, alicato baños y cocinas, coloco suelos y reparo tejados en casas antiguas del casco. Al estar aquí, puedo ir a verlo en el día, medir con calma y pasarte el presupuesto cerrado por escrito. Trabajo también para comunidades de vecinos que necesitan arreglar un portal, una fachada o un patio. Si tu obra está en un barrio o en una urbanización de las afueras, llámame o escríbeme por WhatsApp y lo vemos."
      - titulo: Calera y Chozas
        texto: "En Calera y Chozas hago sobre todo obra de casa de pueblo: retejados, canalones, arreglo de grietas y humedades, y cambios de distribución. Muchas de estas casas tienen tejado de teja árabe, y se puede recuperar la teja buena y poner lámina impermeable debajo. También levanto cercados de patio y cocheras. Voy a ver la obra, te enseño fotos de lo que encuentro y te doy un precio cerrado. Si tu casa está en un pueblo cercano, como Pepino o Cazalegas, pregúntame y lo organizamos."
      - titulo: Pepino
        texto: "En Pepino trabajo con particulares que reforman la cocina o el baño: levanto el suelo antiguo, nivelo la base y coloco gres porcelánico o cerámica, y alicato paredes con las juntas rectas. También hago pequeños arreglos de fachada, escalones y remates de patio. Voy a ver la obra sin compromiso, tomo medidas y te dejo el presupuesto por escrito antes de empezar. Si estás en un pueblo vecino, como Calera y Chozas o Talavera de la Reina, también me tienes cerca y puedo pasarme a verlo."
      - titulo: Cazalegas
        texto: "En Cazalegas me llaman mucho para cerramientos de parcela y muros: cimentación, bloque, pilares, albardilla y el hueco preparado para la puerta. También arreglo tapias que se han venido abajo y levanto pequeños muros de contención con su drenaje. Voy a ver el terreno, te explico qué hace falta y te presupuesto la obra completa. Si tu finca está en Velada, Calera y Chozas o en otro pueblo cercano, me das la dirección y vamos a verlo. Al terminar, limpio y me llevo el escombro."
      - titulo: Velada
        texto: "En Velada hago obras de casa y de patio: escaleras de piedra sobre base de hormigón, escalones, muros bajos y reparaciones de fachada. También coloco suelos en cocheras y terrazas, y alicato baños o cocinas cuando toca renovarlos. Voy yo a verlo, te explico lo que veo y te paso el precio cerrado por escrito. Si vives en un pueblo cercano, como Cazalegas o Talavera de la Reina, también trabajo allí. Escríbeme por WhatsApp con unas fotos y te digo cuándo puedo pasar."
      - titulo: Oropesa
        texto: "En Oropesa y su entorno trabajo en casas, naves pequeñas y locales: cambio tabiques, arreglo goteras y retejo, y repongo suelos y alicatados. También me llaman para reparar grietas, humedades y fachadas. Quedamos un día, voy a verlo, te enseño fotos de lo que veo y te dejo el presupuesto cerrado. Si la obra está en un pueblo cercano de la Campana, como La Pueblanueva, dímelo y lo vemos. Trabajo yo en tu obra, sin subcontratas, y dejo todo recogido cada día."
